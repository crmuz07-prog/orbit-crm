; Orbit test PBX dialplan.
; Every customer call reports itself to the bridge with UserEvent(OrbitCall …) and is recorded with MixMonitor.

[globals]
REC_DIR = /var/spool/asterisk/monitor/orbit

; ───── Reporting subroutines ─────
; Gosub(orbit-start,s,1(direction,from,to))
[orbit-start]
exten => s,1,Set(CHANNEL(hangup_handler_push)=orbit-end,s,1)
 same => n,MixMonitor(${REC_DIR}/${UNIQUEID}.wav)
 same => n,UserEvent(OrbitCall,Orbit-Event: call.ringing,Orbit-Call: ${UNIQUEID},Orbit-Direction: ${ARG1},Orbit-From: ${ARG2},Orbit-To: ${ARG3})
 same => n,Return()

[orbit-answered]
exten => s,1,Set(ORBIT_ANSWERED=${EPOCH})
 same => n,UserEvent(OrbitCall,Orbit-Event: call.answered,Orbit-Call: ${UNIQUEID})
 same => n,Return()

[orbit-end]
exten => s,1,UserEvent(OrbitCall,Orbit-Event: call.ended,Orbit-Call: ${UNIQUEID},Orbit-Dialstatus: ${DIALSTATUS},Orbit-Answeredtime: ${ANSWEREDTIME},Orbit-Answered-At: ${ORBIT_ANSWERED},Orbit-Ended-At: ${EPOCH})
 same => n,Return()

; ───── What the phones can dial ─────
[internal]
; Echo test — check your audio (not logged)
exten => 600,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; Internal call between your devices (not logged)
exten => _1XX,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; *2<number>: the PBX hangs up and calls you back from <number> → inbound test call
exten => _*2X.,1,Answer()
 same => n,Playback(beep)
 same => n,System(/usr/local/bin/orbit-callback ${CALLERID(num)} ${EXTEN:2})
 same => n,Hangup()

; Any other number is an outbound call to a customer. No operator trunk yet,
; so a "virtual customer" answers. With a trunk this becomes Dial(PJSIP/${DIALED}@trunk).
exten => _X.,1,Set(DIALED=${EXTEN})
 same => n,Goto(orbit-outbound,s,1)
exten => _+X.,1,Set(DIALED=${EXTEN})
 same => n,Goto(orbit-outbound,s,1)

[orbit-outbound]
exten => s,1,Gosub(orbit-start,s,1(outbound,${CALLERID(num)},${DIALED}))
 same => n,Ringing()
 same => n,Wait(3)
 same => n,Answer()
 same => n,Gosub(orbit-answered,s,1)
 same => n,Goto(orbit-virtual-customer,s,1)

; The customer's side of a test call: greets you, then echoes your voice.
[orbit-virtual-customer]
exten => s,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Echo()
 same => n,Hangup()

; Runs on the ;2 half of Local/<agent>-<customer>@orbit-inbound-demo/n (created by orbit-callback)
[orbit-inbound-demo]
exten => _X.,1,Set(AGENT=${CUT(EXTEN,-,1)})
 same => n,Set(CUSTOMER=+${CUT(EXTEN,-,2)})
 same => n,Set(CALLERID(all)="Orbit test" <${CUSTOMER}>)
 same => n,Gosub(orbit-start,s,1(inbound,${CUSTOMER},${AGENT}))
 same => n,Dial(PJSIP/${AGENT},30)
 same => n,Hangup()
