# Render Blueprint — FastAPI backend on the free plan. The database is Supabase Postgres (see docs/deploy.md).
# DATABASE_URL is a dashboard secret (Supabase *Session pooler* URI); JWT_SECRET is generated by Render.
services:
  - type: web
    name: orbit-crm-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Base URL for emailed links (invites, password reset, email verification).
      - key: FRONTEND_URL
        value: https://orbit-crm-ashy-phi.vercel.app
      # Closed, ERP-style access: only admins issue logins; no public demo.
      - key: DEMO_ENABLED
        value: "false"
      - key: REGISTRATION_ENABLED
        value: "false"
      # Platform operator, created on start-up. Set both in the Render dashboard (never in git).
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      # Production frontend + its preview deployments on Vercel.
      - key: CORS_ORIGIN_REGEX
        value: https://orbit-crm[a-z0-9-]*\.vercel\.app

