# Render's free web service sleeps after 15 idle minutes and then needs ~50 s to wake up.
# A light request every 10 minutes keeps it awake around the clock: the repository is public, so Actions minutes are
# free, and Render's 750 free hours a month cover one service running all the time.
name: Keep API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API health endpoint
        run: curl --silent --show-error --fail --max-time 90 --retry 2 https://orbit-crm-api-bs1i.onrender.com/api/health
