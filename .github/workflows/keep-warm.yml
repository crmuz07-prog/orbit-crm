# Render's free web service sleeps after 15 idle minutes and then needs ~50 s to wake up. A light request every
# 12 minutes during working hours keeps it awake when people use the CRM.
# Budget: the repository is private (2,000 free Actions minutes a month, each run is billed as one minute), so the
# schedule covers Mon–Sat 08:00–20:00 Tashkent (03:00–14:59 UTC): 5 runs/hour × 12 h × 26 days ≈ 1,560 minutes.
name: Keep API warm

on:
  schedule:
    - cron: "*/12 3-14 * * 1-6"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API health endpoint
        run: curl --silent --show-error --fail --max-time 90 --retry 2 https://orbit-crm-api-bs1i.onrender.com/api/health
